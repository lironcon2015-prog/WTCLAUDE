<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>דארטס — לוח ניקוד</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- ==================== מסך הגדרה ==================== -->
<section id="screen-setup" class="screen is-active">
    <div class="setup-wrap">
        <h1 class="title">🎯 דארטס</h1>

        <div id="resume-banner" class="resume-banner" hidden>
            <p id="resume-text">נמצא משחק פתוח</p>
            <div class="row">
                <button type="button" id="btn-resume" class="btn btn-primary">המשך</button>
                <button type="button" id="btn-discard" class="btn btn-ghost">התחל חדש</button>
            </div>
        </div>

        <div class="field">
            <label class="field-label">מספר שחקנים</label>
            <div class="chips" id="chips-count">
                <button type="button" class="chip" data-count="1">1</button>
                <button type="button" class="chip is-on" data-count="2">2</button>
                <button type="button" class="chip" data-count="3">3</button>
                <button type="button" class="chip" data-count="4">4</button>
            </div>
        </div>

        <div class="field">
            <label class="field-label">שמות</label>
            <div id="name-inputs" class="names"></div>
        </div>

        <div class="field">
            <label class="field-label">ניקוד יעד</label>
            <div class="chips" id="chips-score">
                <button type="button" class="chip" data-score="301">301</button>
                <button type="button" class="chip is-on" data-score="501">501</button>
                <button type="button" class="chip" data-score="701">701</button>
            </div>
            <input type="number" id="input-score" class="input" inputmode="numeric" min="2" max="1001" step="1" value="501" aria-label="ניקוד יעד מותאם">
        </div>

        <div class="field">
            <label class="field-label">מיטב מתוך (legs)</label>
            <div class="chips" id="chips-bestof">
                <button type="button" class="chip" data-bestof="1">1</button>
                <button type="button" class="chip" data-bestof="3">3</button>
                <button type="button" class="chip is-on" data-bestof="5">5</button>
                <button type="button" class="chip" data-bestof="7">7</button>
            </div>
            <input type="number" id="input-bestof" class="input" inputmode="numeric" min="1" max="21" step="1" value="5" aria-label="מיטב מתוך, מותאם">
            <p class="hint" id="legs-hint"></p>
        </div>

        <p class="error" id="setup-error" hidden></p>
        <button type="button" id="btn-start" class="btn btn-primary btn-block">התחל משחק</button>
        <p class="footnote">כניסה חופשית · חובה לסיים בדאבל</p>
    </div>
</section>

<!-- ==================== מסך משחק ==================== -->
<section id="screen-game" class="screen">
    <header class="topbar">
        <button type="button" id="btn-undo" class="btn btn-ghost btn-undo">בטל</button>
        <div class="leg-info" id="leg-info"></div>
        <button type="button" id="btn-quit" class="btn btn-ghost btn-quit">משחק חדש</button>
    </header>

    <div id="players" class="players"></div>

    <div id="bust-banner" class="bust-banner" hidden></div>

    <div class="turnbar">
        <div class="darts" id="turn-darts"></div>
        <div class="turn-total">סה״כ בסיבוב: <span class="ltr" id="turn-total">0</span></div>
    </div>

    <div id="board-wrap" class="board-wrap"></div>

    <div class="keypad-section">
        <button type="button" id="btn-keypad" class="btn btn-ghost btn-block" aria-expanded="false">מקלדת</button>
        <div id="keypad" class="keypad" hidden>
            <div class="chips chips-mult" id="chips-mult">
                <button type="button" class="chip is-on" data-mult="1">סינגל</button>
                <button type="button" class="chip" data-mult="2">דאבל</button>
                <button type="button" class="chip" data-mult="3">טריפל</button>
            </div>
            <div class="keypad-grid" id="keypad-grid"></div>
        </div>
    </div>
</section>

<!-- ==================== שכבות ==================== -->
<div id="overlay-leg" class="overlay" hidden>
    <div class="overlay-card">
        <h2 id="leg-title"></h2>
        <p id="leg-sub" class="overlay-sub"></p>
        <button type="button" id="btn-next-leg" class="btn btn-primary btn-block">ליג הבא</button>
        <button type="button" class="btn btn-ghost btn-block js-undo">בטל</button>
    </div>
</div>

<div id="overlay-match" class="overlay" hidden>
    <div class="overlay-card">
        <h2 id="match-title"></h2>
        <p id="match-sub" class="overlay-sub"></p>
        <button type="button" id="btn-new-match" class="btn btn-primary btn-block">משחק חדש</button>
        <button type="button" class="btn btn-ghost btn-block js-undo">בטל</button>
    </div>
</div>

<script src="board.js?v=1"></script>
<script src="checkout.js?v=1"></script>
<script src="engine.js?v=1"></script>
<script src="storage.js?v=1"></script>
<script src="app.js?v=1"></script>
<script src="tests.js?v=1"></script>
</body>
</html>
